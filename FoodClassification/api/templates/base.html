<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Food Classification{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <h1>Food Classification System</h1>
            <p>Classify food images using AI</p>
        </div>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Food Classification API</p>
            <p><a href="/docs">API Documentation</a> | <a href="/api/classes">View All Classes</a></p>
        </div>
    </footer>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
